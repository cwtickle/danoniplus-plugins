name: PR check

# PRのタイトル・用途フォルダ・本文(add: の場合)を検証する。
# ブランチ保護で、このジョブ(check-pr)を必須のステータスチェックにすると、
# 形式の誤りをマージ前に止められます。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | [.status, .filename] | @tsv' > "${RUNNER_TEMP}/files.tsv"

      - name: Validate PR title / folder / body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/plugin_tool.py check --files "${RUNNER_TEMP}/files.tsv"
