name: Daily release

# 毎日 0:15(JST)ごろに、前日(JST)にマージされたPRを確認し、
# 用途フォルダを変更するPR(chore: と Dependabot のPRを除く)があった日だけ、
# その日付のタグ YYYY-MM-DD でリリースを作成する(リリースノートは自動生成)。
#   - タグは、その日の終わり(JST 24:00)時点のデフォルトブランチのコミットに付ける
#   - すでにタグがある日はスキップする(何度実行しても同じ結果。タグの付け替えはしない)
#   - 実行が抜けた日があっても、直近 LOOKBACK_DAYS 日分は次回にまとめて補う
# 手動実行(workflow_dispatch)では、日付(JST)を指定して、その1日分だけ作成できる。

on:
  schedule:
    - cron: "15 15 * * *"   # UTC 15:15 = JST 0:15(毎時0分は混み合って遅れやすいため、少しずらしています)
  workflow_dispatch:
    inputs:
      date:
        description: "対象日(JST, YYYY-MM-DD)。空なら、前日までの直近7日分を確認します"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: "7"
    steps:
      - uses: actions/checkout@v7

      - name: Plan releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          if [ -n "${INPUT_DATE}" ]; then
            if ! [[ "${INPUT_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::date は YYYY-MM-DD 形式で指定してください。"
              exit 1
            fi
            FROM="${INPUT_DATE}"
            TO="${INPUT_DATE}"
          else
            FROM=$(date -d "${TODAY} -${LOOKBACK_DAYS} day" +%F)
            TO=$(date -d "${TODAY} -1 day" +%F)
          fi
          # JSTの1日はUTCの2日にまたがるため、UTCでは1日広く検索し、日付の絞り込みはスクリプト側(JST)で行う
          SEARCH_FROM=$(date -d "${FROM} -1 day" +%F)
          gh pr list --repo "${REPO}" --state merged --base "${BASE_REF}" \
            --search "merged:${SEARCH_FROM}..${TO}" --limit 500 \
            --json number,title,author,url,mergedAt,files > "${RUNNER_TEMP}/prs.json"
          gh api "repos/${REPO}/tags" --paginate --jq '.[].name' > "${RUNNER_TEMP}/tags.txt"
          python3 .github/scripts/plugin_tool.py plan-releases \
            --prs "${RUNNER_TEMP}/prs.json" --tags "${RUNNER_TEMP}/tags.txt" \
            --from-day "${FROM}" --to-day "${TO}" --out-dir "${RUNNER_TEMP}/release"

      - name: Create releases
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          while read -r TAG; do
            [ -n "${TAG}" ] || continue
            # その日の終わり(JST 24:00 = UTC 15:00)時点の、デフォルトブランチの最新コミット
            SHA=$(gh api "repos/${REPO}/commits?sha=${BASE_REF}&until=${TAG}T15:00:00Z&per_page=1" --jq '.[0].sha')
            if [ -z "${SHA}" ] || [ "${SHA}" = "null" ]; then
              echo "::error::${TAG} 時点のコミットが見つかりません。"
              exit 1
            fi
            gh release create "${TAG}" --repo "${REPO}" --target "${SHA}" --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/release/${TAG}.md"
          done < "${RUNNER_TEMP}/release/plan.txt"
